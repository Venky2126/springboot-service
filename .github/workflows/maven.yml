name: OTP Service Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  actions: write
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build project
        run: |
          echo "Building the project..."
          cd springboot-service/otp-one-time-password-service
          mvn clean package
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: springboot-service/otp-one-time-password-service/target

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: target/
      - name: Test with Maven
        run: |
          cd springboot-service/otp-one-time-password-service
          mvn test
      - name: Integration tests
        run: |
          cd springboot-service/otp-one-time-password-service
          mvn verify

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: target/
      - name: Check for outdated dependencies
        run: |
          cd springboot-service/otp-one-time-password-service
          mvn versions:display-dependency-updates

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: springboot-service/otp-one-time-password-service/target/
      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: venkydasari/greetify
          tags: latest
          registry: docker.io
          dockerfile: springboot-service/otp-one-time-password-service/Dockerfile
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
