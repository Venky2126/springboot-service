name: OTP Service Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  actions: write
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify directory structure
        run: |
          echo "Listing root directory:"
          ls -la
          echo "Listing otp-one-time-password-service directory:"
          ls -la otp-one-time-password-service

      - name: Build project
        run: |
          echo "Building the project..."
          cd otp-one-time-password-service
          mvn clean install

      - name: Verify target directory
        run: |
          echo "Listing target directory:"
          ls -la otp-one-time-password-service/target

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otp-one-time-password-service-jar
          path: otp-one-time-password-service/target

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: otp-one-time-password-service-jar
          path: otp-one-time-password-service/target

      - name: Test with Maven
        run: |
          cd otp-one-time-password-service
          mvn test

      - name: Integration tests
        run: |
          cd otp-one-time-password-service
          mvn verify

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: otp-one-time-password-service-jar
          path: otp-one-time-password-service/target

      - name: Check for outdated dependencies
        run: |
          cd otp-one-time-password-service
          mvn versions:display-dependency-updates

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: otp-one-time-password-service-jar
          path: otp-one-time-password-service/target

      - name: Verify target directory
        run: |
          echo "Listing target directory:"
          ls -la otp-one-time-password-service/target

      - name: Build & push Docker image
        run: |
          # Set the correct working directory
          cd otp-one-time-password-service
          # Build the Docker image using the correct context
          docker build -f Dockerfile -t docker.io/venkydasari/otp:latest .
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}