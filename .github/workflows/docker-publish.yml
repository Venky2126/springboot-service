name: OTP Service Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - feature/otp-service
permissions:
  contents: read
  actions: write
  checks: write
  statuses: write
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn clean install
      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: otp-service-jar
          path: target/otp-service-*.jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: greeting-service-jar
          path: target/
      - name: Test with Maven
        run: mvn test
      - name: Integration tests
        run: mvn verify
