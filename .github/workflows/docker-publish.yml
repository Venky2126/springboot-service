name: OTP Service Pipeline

on:
  push:
    branches:
      - feature/otp-service
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  actions: write
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build project
        run: |
          echo "Building the project..."
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts  # Ensure this name is consistent
          path: path/to/artifacts

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts  # Ensure this matches the upload artifact name
          path: target/
      - name: Test with Maven
        run: mvn test
      - name: Integration tests
        run: mvn verify

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts  # Ensure this matches the upload artifact name
          path: target/
      - name: Check for outdated dependencies
        run: mvn versions:display-dependency-updates

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v3
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts  # Ensure this matches the upload artifact name
          path: target/
      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: venkydasari/greetify
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
