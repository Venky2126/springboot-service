<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .starter-template {
            padding: 100px 15px;
            text-align: center;
        }

        .starter-template h {
            color: red;
        }

        @media (max-width: 576px) {
            .starter-template {
                padding: 50px 15px;
            }
        }

        @media (max-width: 768px) {
            .starter-template h1 {
                font-size: 24px;
            }

            .starter-template h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">

    <div class="starter-template">
        <h>403 - Access is denied</h>
        <p th:inline="text">Hello : [[${username}]], you do not have permission to access this page.</p>
    </div>

</div> 
</body>
</html>
