<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .form-container {
            background-color: #7ad5e5d2;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 15px;
            }

            .form-group button {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form id="signupForm" th:action="@{/v1/signup}" method="post" onsubmit="return validateForm()">
            <fieldset>
                <h1>User Registration</h1>

                <div class="form-group">
                    <input type="text" name="username" id="username" class="form-control input-lg" placeholder="UserName" required="true" autofocus="true" />
                </div>
                <div class="form-group">
                    <input type="password" name="password" id="password" class="form-control input-lg" placeholder="Password" required="true" />
                </div>
                <div class="form-group">
                    <input type="text" name="email" id="email" class="form-control input-lg" placeholder="E-Mail" required="true" />
                </div>
                <div class="form-group">
                    <select class="form-control" id="role" name="role">
                        <option value="ROLE_USER">User</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" name="fullName" id="fullName" class="form-control input-lg" placeholder="Full Name" required="true" />
                </div>
                <div class="form-group">
                    <select class="form-control" id="country" name="country">
                        <option value="India">India</option>
                        <option value="China">China</option>
                        <option value="USA">USA</option>
                        <option value="Japan">Japan</option>
                        <option value="Germany">Germany</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="France">France</option>
                        <option value="Brazil">Brazil</option>
                        <option value="Italy">Italy</option>
                    </select>
                </div>
                <div class="row">
                    <div class="col-2">
                        <label>VERIFY</label>
                    </div>
                    <div class="col-4">
                        <div class="g-recaptcha" data-sitekey="6LcqmM8qAAAAAOtviN25IPEQ0g-ku2p-4a4E05aL" required="true"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-lg btn-success btn-block">Sign Up</button>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>

    <script>
        function validateForm() {
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var email = document.getElementById('email').value;
            var fullName = document.getElementById('fullName').value;
            var recaptcha = grecaptcha.getResponse();

            if (username === "" || password === "" || email === "" || fullName === "") {
                alert("All fields must be filled out");
                return false;
            }

            if (recaptcha === "") {
                alert("Please complete the reCAPTCHA verification");
                return false;
            }

            return true;
        }
    </script>
</body>
</html>
