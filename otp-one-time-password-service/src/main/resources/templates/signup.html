<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .form-container {
            background-color: #7ad5e5d2;
            padding: 60px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <form th:action="@{/signup}" method="post">
            <fieldset>
                <h1>User Registration</h1>



                <div class="form-group">
                    <input type="text" name="username" id="username" class="form-control input-lg"
                        placeholder="UserName" required="true" autofocus="true" />
                </div>
                <div class="form-group">
                    <input type="password" name="password" id="password" class="form-control input-lg"
                        placeholder="Password" required="true" />
                </div>
                <div class="form-group">
                    <input type="text" name="role" id="role" class="form-control input-lg" placeholder="Role"
                        required="true" />
                </div>
                <div class="form-group">
                    <input type="text" name="fullName" id="fullName" class="form-control input-lg"
                        placeholder="Full Name" required="true" />
                </div>
                <div class="form-group">
                    <input type="text" name="country" id="country" class="form-control input-lg"
                        placeholder="Country" required="true" />
                </div>

                <div class="row">

                    <div class="col-xs-6 col-sm-6 col-md-6">
                        <button type="submit" class="btn btn-lg btn-success btn-block">Sign Up</button>

                    </div>
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
</body>

</html>
