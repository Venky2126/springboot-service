<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <style>
    .footer {
      background-color: #f8f9fa;
      padding: 20px 0;
    }

    .social-link {
      color: #007bff;
      text-decoration: none;
    }

    .social-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 576px) {
      .text-right {
        text-align: center !important;
        margin-top: 10px;
      }

      .list-inline {
        padding-left: 0;
        list-style: none;
      }

      .list-inline-item {
        display: inline-block;
        margin-right: .5rem;
      }
    }
  </style>
</head>

<body>
  <div th:fragment="footer">
    <footer class="footer">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-6">
            <p class="copyright">Copyright 2025. All rights reserved.</p>
          </div>
          <div class="col-md-6 text-right">
            <ul class="list-inline">
              <li class="list-inline-item"><a href="#" class="social-link">Terms of Service</a></li>
              <li class="list-inline-item"><a href="#" class="social-link">Privacy Policy</a></li>
              <li class="list-inline-item"><a href="#" class="social-link">Contact Us</a></li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>

</html>
