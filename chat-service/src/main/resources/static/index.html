<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .chat-message {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: flex-start;
            position: relative;
        }
        .chat-message.self {
            justify-content: flex-end;
        }
        .chat-message .nickname {
            font-weight: bold;
            margin-right: 10px;
        }
        .chat-message.self .nickname {
            display: none;
        }
        .event-message {
            padding: 10px;
            font-style: italic;
            color: #888;
            text-align: center;
        }
        .status {
            font-size: 0.8em;
            color: #888;
            position: absolute;
            bottom: -15px;
            right: 10px;
        }
        .seen {
            font-size: 0.8em;
            color: #888;
        }
        .blue-tick {
            color: gray;
            font-size: 0.8em;
        }
        .blue-tick.seen {
            color: blue;
        }
        .timestamp {
            font-size: 0.7em;
            color: #aaa;
            margin-left: 5px;
        }
        @media (max-width: 600px) {
            .chat-container {
                padding: 10px;
            }
            .chat-message {
                padding: 5px;
            }
            .event-message {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
<noscript>
    <h2>Sorry! Your browser doesn't support Javascript</h2>
</noscript>

<div id="username-page" class="username-page-container">
    <h1 class="title">Enter your details</h1>
    <form id="usernameForm" name="usernameForm">
        <div class="form-group">
            <input type="text" id="name" placeholder="Name" autocomplete="off" class="form-control">
        </div>
        <div class="form-group">
            <input type="email" id="username" placeholder="Enter your email" autocomplete="off" class="form-control">
        </div>
        <div class="form-group">
            <button type="submit" class="accent username-submit">Start Chatting</button>
        </div>
    </form>
</div>

<div id="chat-page" class="hidden">
    <div class="chat-container">
        <div class="chat-header">
            Boot Chat Application
            <button id="leaveChat" class="leave-chat">Leave Chat</button>
        </div>
        <ul id="messageArea"></ul>
        <form id="messageForm" name="messageForm">
            <div class="form-group">
                <div class="input-group clearfix">
                    <input type="text" id="message" placeholder="Type a message..." autocomplete="off" class="form-control">
                    <button type="submit" class="primary">Send</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    var stompClient = null;
    var colors = {};
    var seenMessages = new Set();

    document.addEventListener("DOMContentLoaded", function () {
        if (sessionStorage.getItem('username') && sessionStorage.getItem('name')) {
            connect();
        } else {
            document.querySelector('#username-page').classList.remove('hidden');
        }
    });

    document.querySelector('#usernameForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var username = document.querySelector('#username').value.trim();
        var name = document.querySelector('#name').value.trim();

        if (username && name) {
            sessionStorage.setItem('username', username);
            sessionStorage.setItem('name', name);
            connect();
        }
    });

    document.querySelector('#leaveChat').addEventListener('click', leaveChat, true);

    function connect() {
        var username = sessionStorage.getItem('username');
        var name = sessionStorage.getItem('name');
        var sessionId = generateSessionId();

        var messageRequest = {
            messageType: 'JOIN',
            sender: username,
            name: name
        };

        // Update URL with sessionId
        var newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?sessionId=" + sessionId;
        window.history.pushState({ path: newUrl }, '', newUrl);

        // Connect to WebSocket
        var socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.querySelector('#username-page').classList.add('hidden');
            document.querySelector('#chat-page').classList.remove('hidden');

            stompClient.send("/app/chat.addUser", {}, JSON.stringify(messageRequest));

            stompClient.subscribe('/topic/public', onMessageReceived);
            stompClient.subscribe('/topic/seen', onMessageSeen);
        });
    }

    function generateSessionId() {
        return '_' + Math.random().toString(36).substr(2, 9);
    }

    function sendMessage(event) {
        event.preventDefault();
        var messageContent = document.querySelector('#message').value.trim();
        var username = sessionStorage.getItem('username');
        var name = sessionStorage.getItem('name');

        if (messageContent && stompClient && username && name) {
            var chatMessage = {
                id: generateUniqueId(),  // Ensure each message has a unique ID
                sender: username,
                content: messageContent,
                messageType: 'CHAT',
                name: name,
                timestamp: getCurrentISTTime()
            };

            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
            document.querySelector('#message').value = '';

            // Display 'blue tick' status with timestamp
            var messageElement = document.createElement('li');
            messageElement.classList.add('chat-message', 'self');
            var textElement = document.createElement('span');
            var messageText = document.createTextNode(messageContent);
            textElement.appendChild(messageText);
            messageElement.appendChild(textElement);
            var statusElement = document.createElement('span');
            statusElement.classList.add('blue-tick');
            statusElement.textContent = '✔✔';
            messageElement.appendChild(statusElement);
            var timestampElement = document.createElement('span');
            timestampElement.classList.add('timestamp');
            timestampElement.textContent = chatMessage.timestamp;
            messageElement.appendChild(timestampElement);
            messageElement.dataset.messageId = chatMessage.id; // Store message ID in the element
            document.querySelector('#messageArea').appendChild(messageElement);
            document.querySelector('#messageArea').scrollTop = document.querySelector('#messageArea').scrollHeight;
        }
    }

    function leaveChat() {
        var username = sessionStorage.getItem('username');
        var name = sessionStorage.getItem('name');

        if (stompClient && username && name) {
            var chatMessage = {
                sender: username,
                messageType: 'LEAVE',
                name: name
            };

            stompClient.send("/app/chat.removeUser", {}, JSON.stringify(chatMessage));
            stompClient.disconnect();

            document.querySelector('#chat-page').classList.add('hidden');
            document.querySelector('#username-page').classList.remove('hidden');

            // Clear session storage
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('name');
        }
    }

    function onMessageReceived(payload) {
        var message = JSON.parse(payload.body);
        var username = sessionStorage.getItem('username');

        var messageElement = document.createElement('li');

        if (message.messageType === 'JOIN') {
            messageElement.classList.add('event-message');
            message.content = message.name + ' joined!';
        } else if (message.messageType === 'LEAVE') {
            messageElement.classList.add('event-message');
            message.content = message.name + ' left!';
        } else {
            messageElement.classList.add('chat-message');
            if (message.sender === username) {
                // Do not display the message again for the sender
                return;
            } else {
                var usernameElement = document.createElement('strong');
                usernameElement.classList.add('nickname');
                var usernameText = document.createTextNode(message.name);
                usernameElement.appendChild(usernameText);
                usernameElement.style.color = getUsernameColor(message.sender);
                messageElement.appendChild(usernameElement);
                sendSeenNotification(message.id);
            }
        }

        var textElement = document.createElement('span');
        var messageText = document.createTextNode(message.content);
        textElement.appendChild(messageText);

        messageElement.appendChild(textElement);

        var timestampElement = document.createElement('span');
        timestampElement.classList.add('timestamp');
        timestampElement.textContent = message.timestamp;
        messageElement.appendChild(timestampElement);

        messageElement.dataset.messageId = message.id; // Store message ID in the element

        document.querySelector('#messageArea').appendChild(messageElement);
        document.querySelector('#messageArea').scrollTop = document.querySelector('#messageArea').scrollHeight;
    }

    function createSeenElement(messageId) {
        var seenElement = document.createElement('span');
        seenElement.classList.add('seen');
        seenElement.id = 'seen-' + messageId;
        seenElement.textContent = 'Seen';
        seenElement.style.display = 'none';
        return seenElement;
    }

    function sendSeenNotification(messageId) {
        if (stompClient) {
            const sessionId = getSessionId();
            const payload = {
                messageId: messageId,
                sessionId: sessionId
            };
            stompClient.send("/app/chat.seenMessage", {}, JSON.stringify(payload));
            console.log("Sent seen notification with payload: ", payload);
        }
    }

    function onMessageSeen(payload) {
        var message = JSON.parse(payload.body);
        var seenElement = document.getElementById('seen-' + message.messageId);
        if (seenElement) {
            seenElement.style.display = 'inline';
            setTimeout(() => {
                seenElement.style.display = 'none';
            }, 2000); // Hide "seen" status after 2 seconds
        }

        // Update the blue tick to "Seen" for the sender
        var messageElements = document.querySelectorAll('.chat-message.self');
        messageElements.forEach(function (messageElement) {
            var statusElement = messageElement.querySelector('.blue-tick');
            if (statusElement) {
                statusElement.classList.add('seen'); // Change color to blue
                statusElement.textContent = '✔✔'; // Ensure the tick remains
            }
        });
    }

    function getSessionId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('sessionId');
    }

    function getUsernameColor(username) {
        if (!colors[username]) {
            var hash = 0;
            for (var i = 0; i < username.length; i++) {
                hash = 31 * hash + username.charCodeAt(i);
            }
            var index = Math.abs(hash % COLORS.length);
            colors[username] = COLORS[index];
        }
        return colors[username];
    }
    const COLORS = [
        '#e21400', '#91580f', '#f8a700', '#f78b00',
        '#58dc00', '#287b00', '#a8f07a', '#4ae8c4',
        '#3b88eb', '#3824aa', '#a700ff', '#d300e7'
    ];

    document.querySelector('#messageForm').addEventListener('submit', sendMessage, true);

    function getCurrentISTTime() {
        var now = new Date();
        var istOffset = 5.5 * 60 * 60 * 1000; // IST offset in milliseconds
        var istTime = new Date(now.getTime() + istOffset);
        var hours = istTime.getUTCHours().toString().padStart(2, '0');
        var minutes = istTime.getUTCMinutes().toString().padStart(2, '0');
        return hours + ':' + minutes;
    }

    function generateUniqueId() {
        return '_' + Math.random().toString(36).substr(2, 9);
    }
</script>
</body>
</html>
